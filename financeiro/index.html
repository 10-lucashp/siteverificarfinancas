<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0b0b12">
    <meta name="description" content="Controle suas finanças de forma simples e organizada.">

    <title>Entrar | Meu Dinheiro</title>

    <link rel="stylesheet" href="style.css">

    <script type="module" src="login.js"></script>
</head>

<body>
    <main class="container">

        <section class="auth-card">

            <h1>Meu Dinheiro</h1>

            <p>
                Organize suas finanças, acompanhe seus gastos
                e tenha mais controle sobre seu dinheiro.
            </p>

            <form id="auth-form">

                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required
                >

                <label for="password">Senha</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    minlength="6"
                    required
                >

                <button type="submit" id="login-button">
                    Entrar na minha conta
                </button>

                <button type="button" id="signup-button">
                    Criar minha conta
                </button>

                <p id="auth-message" role="status" aria-live="polite"></p>

            </form>

            <p class="auth-footer">
                Suas finanças organizadas em um só lugar.
            </p>

        </section>

    </main>
</body>
</html>
